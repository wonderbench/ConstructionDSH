# The `drawing-split` agent preset: a mechanical drawing-PDF split workflow.
#
# This file is an AGENT-PLANE composition, mounted the same standing way as the
# `standard` preset: the roster mounts it once under a standing scope, and
# every session naming it joins by scope parentage. The host composition keeps
# everything a preset must not own: the registries themselves, the sandbox and
# approval stack, persistence, and the model route.
#
# The workflow is deliberately narrow: inspect each drawing PDF, split it with
# `construction_pdf_split` by explicit page ranges, per page, or by bookmark,
# deliver the output files plus the index, and stop. There is no shell, no web,
# no delegation, and no plan mode — the procedure is fixed, so the composition
# admits no way to leave it. The drawing tools come from the construction
# runtime mounted below with ONLY its drawing surface: `business: false`
# keeps the four business Skills, the composer commands, and the task tools
# exclusive to the `engineering` preset, and with the business surface off the
# runtime registers no skill provider, so this preset carries no
# skill-filesystem/tool-skill rows either.
#
# A service row here MUST sit inside a group carrying an `isolate` realm; the
# compaction group below is the only service-bearing group. Every other row
# registers tools, skill-catalog contributions, or listeners and needs no
# realm.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are a drawing-split workflow agent powered by the {{model}} model.
      Your only job is the mechanical splitting of drawing PDF files. Inspect
      each PDF with construction_files_inspect before splitting it, and split
      ONLY with construction_pdf_split, using explicit page ranges, per-page
      splitting, or bookmarks — never guess boundaries. When every file is
      split, deliver the output files and their index, then STOP: no summaries,
      no standards retrieval, no follow-up business work. Structured
      decomposition (MinerU) is unavailable in this mode; answer any request
      for it with that explicit unsupported status. Blank or missing inputs
      (files, page ranges, output names) are asked about, never invented.

# ── multi-file progress and ambiguity questions ─────────────────────────────

# A split run covers many files; the todo list is the progress surface that
# survives across the per-file tool calls.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Page ranges and split granularity are user-owned choices; ask when they are
# blank or ambiguous instead of inventing boundaries.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# Split runs end by handing the output files and index to the user; delivery
# is explicit, never an automatic follow-up.
- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── drawing tools ───────────────────────────────────────────────────────────

# The read-only file tools (`construction_files_inspect`, plus read/search so
# the split parts stay readable) and `construction_pdf_split`, from the
# construction runtime with its business surface disabled — see the header
# contract. The runtime publishes no services, so it needs no realm.
- id: construction-runtime
  name: '@deepseek-ai/dsh-construction-runtime'
  config:
    business: false

# ── compaction ──────────────────────────────────────────────────────────────

# Long multi-file splits accumulate tool results; fold and prune them with
# the same realm layout as the `standard` preset. `compaction-basic` reads
# `toolResultPrune` through `ctx.get`, so the pruner must share this realm
# rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance, the same way the
# `standard` preset does.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── deliberate omissions ────────────────────────────────────────────────────

# No `tool-bash` / `tool-pwsh`: splitting is mechanical and runs entirely
# inside construction_pdf_split; arbitrary shell or code execution adds an
# execution surface the workflow never needs.
#
# No delegation rows (`tool-subagent*`, `workflow-ptc`, `tool-workflow`) and no
# plan mode: the procedure is fixed per file, so there is nothing to delegate
# and nothing to plan — plan mode would gate a fixed sequence behind an
# approval the preset already encodes.
#
# No `tool-web`: the workflow reads local drawing PDFs and answers from them;
# no retrieval or fetch capability is needed, and the persona forbids
# standards retrieval anyway.
