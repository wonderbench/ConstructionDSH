# Agent preset drawing-split: one `@deepseek-ai/dsh-agent-preset` declaration
# inserted after the web patch. The workflow is deliberately narrow: inspect
# each drawing PDF, split it with `construction_pdf_split` by explicit page
# ranges, per page, or by bookmark, deliver the output files plus the index,
# and stop. The construction runtime mounts with `business: false`, so the
# four business Skills, the composer commands, and the task tools stay
# exclusive to the `engineering` preset. Edits saved from the Web editor
# override this row's `config.plugins` by id from the profile patch.
- insert:
    - id: preset-drawing-split
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: drawing-split
        order: 2
        plugins:
          # The preset's own persona, shadowing the deployment default for this
          # agent. `{{model}}` and `{{cwd}}` resolve from the agent's own route
          # and workspace.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are a drawing-split workflow agent powered by the {{model}} model.
                Your only job is the mechanical splitting of drawing PDF files. Inspect
                each PDF with construction_files_inspect before splitting it, and split
                ONLY with construction_pdf_split, using explicit page ranges, per-page
                splitting, or bookmarks — never guess boundaries. When every file is
                split, deliver the output files and their index, then STOP: no summaries,
                no standards retrieval, no follow-up business work. Structured
                decomposition (MinerU) is unavailable in this mode; answer any request
                for it with that explicit unsupported status. Blank or missing inputs
                (files, page ranges, output names) are asked about, never invented.

          # A split run covers many files; the todo list is the progress surface
          # that survives across the per-file tool calls.
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # Page ranges and split granularity are user-owned choices; ask when
          # they are blank or ambiguous instead of inventing boundaries.
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # Split runs end by handing the output files and index to the user;
          # delivery is explicit, never an automatic follow-up.
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # The read-only file tools (`construction_files_inspect`, plus
          # read/search so the split parts stay readable) and
          # `construction_pdf_split`, from the construction runtime with its
          # business surface disabled.
          - id: construction-runtime
            name: '@deepseek-ai/dsh-construction-runtime'
            config:
              business: false

          # Long multi-file splits accumulate tool results; fold and prune them
          # with the same realm layout as the `standard` preset.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # Deliberate omissions: no shell (splitting runs inside
          # construction_pdf_split), no delegation and no plan mode (the
          # procedure is fixed), and no tool-web (the workflow reads local
          # drawing PDFs only).
